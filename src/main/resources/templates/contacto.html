<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="es">

<head>
    <title>Contacto — Hotel El Descanso Eterno</title>
</head>

<body>
<div layout:fragment="content">

    <div class="bg-secondary text-white py-5">
        <div class="container">
            <p class="text-uppercase text-warning fw-bold small mb-2" style="letter-spacing:2px">Escríbenos</p>
            <h1 class="display-5 fw-bold">Contacto</h1>
            <p class="lead text-white-50 mt-2 mb-0">¿Tienes alguna consulta? Envíanos un mensaje.</p>
        </div>
    </div>

    <section class="container my-5">
        <div class="row g-4">
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <div class="alert alert-success" th:if="${mensajeExito != null}" th:text="${mensajeExito}"></div>

                        <form th:action="@{/contacto/enviar}" method="post" class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre completo</label>
                                <input type="text" class="form-control" name="nombre" required>
                                <div class="invalid-feedback">El nombre es obligatorio.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Correo electrónico</label>
                                <input type="email" class="form-control" name="correo" required>
                                <div class="invalid-feedback">Ingresa un correo válido.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Mensaje</label>
                                <textarea class="form-control" name="mensaje" rows="4" required></textarea>
                                <div class="invalid-feedback">El mensaje es obligatorio.</div>
                            </div>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-send me-1"></i>Enviar mensaje
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card shadow-sm h-100">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3"><i class="bi bi-geo-alt me-2"></i>Información de contacto</h5>
                        <p class="text-muted mb-2"><i class="bi bi-telephone me-2"></i>(01) 234-5674</p>
                        <p class="text-muted mb-2"><i class="bi bi-envelope me-2"></i>reservas@eldescansoeterno.pe</p>
                        <p class="text-muted mb-0"><i class="bi bi-geo-alt me-2"></i>San Isidro, Lima — Perú</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

</div>
</body>
</html>
