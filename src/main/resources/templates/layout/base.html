<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hotel El Descanso Eterno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        footer .fs-5 a {
            transition: color 0.2s ease, transform 0.2s ease;
            display: inline-block;
        }

        footer .fs-5 a:hover {
            color: #fff !important;
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- ========== NAVBAR (visible en todas las páginas) ========== -->
    <nav class="navbar navbar-expand-lg navbar-secondary bg-secondary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-normal" th:href="@{/}">
                <i class="bi bi-building me-2"></i>Hotel El Descanso Eterno
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item">
                        <a th:href="@{/}" th:classappend="${activePage == 'home'} ? ' active'" class="nav-link">
                            <i class="bi bi-house me-1"></i>Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/habitaciones}" th:classappend="${activePage == 'habitaciones'} ? ' active'"
                            class="nav-link">
                            <i class="bi bi-door-open me-1"></i>Habitaciones
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/nosotros}" th:classappend="${activePage == 'nosotros'} ? ' active'"
                            class="nav-link">
                            <i class="bi bi-info-circle me-1"></i>Nosotros
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/contacto}" th:classappend="${activePage == 'contacto'} ? ' active'"
                            class="nav-link">
                            <i class="bi bi-envelope me-1"></i>Contacto
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/login}" th:classappend="${activePage == 'login'} ? ' active'"
                            class="nav-link">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        <!-- ========== CONTENIDO DE CADA PÁGINA ========== -->
        <div layout:fragment="content"></div>
    </main>

    <!-- ========== FOOTER (visible en todas las páginas) ========== -->
    <footer class="bg-secondary text-white py-4 mt-5">
        <div class="container">
            <div class="row g-3 align-items-center">
                <div class="col-md-4">
                    <p class="fw-bold text-warning mb-1"><i class="bi bi-building me-2"></i>Hotel El Descanso Eterno</p>
                    <p class="text-white-50 mb-0 small">San Isidro, Lima — Perú</p>
                </div>
                <div class="col-md-4 text-md-center">
                    <p class="text-white-50 mb-0 small">
                        <i class="bi bi-telephone me-1"></i>(01) 234-5674
                        &nbsp;|&nbsp;
                        <i class="bi bi-envelope me-1"></i>reservas@eldescansoeterno.pe
                    </p>
                </div>
                <div class="col-md-4 text-md-end">
                    <p class="text-white-50 mb-0 small">
                        Administrado por<br>
                        <span class="text-warning">Grupo 3</span>
                    </p>
                </div>
            </div>

            <hr class="border-light-subtle opacity-25 my-3">

            <div class="row align-items-center g-3">
                <div class="col-md-8">
                    <p class="text-white-50 mb-0 small text-center text-md-start">
                        &copy; <span th:text="${#dates.year(#dates.createNow())}"></span> Hotel El Descanso Eterno.
                        Todos los derechos reservados.
                    </p>
                </div>
                <div class="col-md-4">
                    <div class="d-flex justify-content-center justify-content-md-end gap-3 fs-5">
                        <a href="#" class="text-white-50" title="Facebook"><i class="bi bi-facebook"></i></a>
                        <a href="#" class="text-white-50" title="Instagram"><i class="bi bi-instagram"></i></a>
                        <a href="#" class="text-white-50" title="TikTok"><i class="bi bi-tiktok"></i></a>
                        <a href="https://wa.me/51987654321" target="_blank" class="text-white-50" title="WhatsApp">
                            <i class="bi bi-whatsapp"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.needs-validation').forEach(form => {
                form.addEventListener('submit', e => {
                    if (!form.checkValidity()) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                    form.classList.add('was-validated');
                });
            });
        });
    </script>
    <th:block layout:fragment="scripts"></th:block>
</body>

</html>
